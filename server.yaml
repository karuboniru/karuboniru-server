postprocess-script: manifests/treecompose-post.sh
postprocess:
  - |
    set -xeuo pipefail
    # Enable root login with simple password, to
    # make sure user can get access after applying
    # image
    echo "root" | passwd --stdin root
    mkdir -p /etc/ssh/sshd_config.d
    echo "PasswordAuthentication no" > /etc/ssh/sshd_config.d/99-password-authentication.conf
    # selinux modification
    semanage fcontext -a -f a -t user_home_t -r 's0' '/media/storage(/.*)?'
    semodule -i /etc/cils/*.cil /usr/share/udica/templates/{base_container.cil,net_container.cil}
    # Compile selinux module!
    cd /etc/cils
    checkmodule -M -m -o pmda_allow.mod pmda_allow.te
    semodule_package -o pmda_allow.pp -m pmda_allow.mod
    # Install the selinux module!
    semodule -i pmda_allow.pp
    cd /
    rm -rf /etc/cils
    setsebool -P nis_enabled 1
    setsebool -P samba_enable_home_dirs 1
    # Services
    systemctl enable cockpit.socket
    systemctl disable sshd
    systemctl enable sshd.socket
    # subuid for containers
    echo containers:2147483647:2147483648 > /etc/subuid
    echo containers:2147483647:2147483648 > /etc/subgid

    kmodsrc=$(realpath /usr/share/nvidia-kmod-*/*.tar.xz)
    if [ -f $kmodsrc ]; then
      kmodule_path=$(realpath /lib/modules/*)
      # disable warnings during build
      kernel_uname=$(basename $kmodule_path)
      mkdir -p /tmp/kmod-build
      tar -xvf $kmodsrc -C /tmp/kmod-build
      # try with kernel-open first
      # if it fails, try with kernel
      (cd /tmp/kmod-build/kernel-open && \
      make -O V=1 VERBOSE=1 CC='gcc -O2 -std=gnu17' \
              LD=ld.bfd KERNEL_UNAME=${kernel_uname} \
              modules -j$(nproc) && \
      make -O V=1 VERBOSE=1 CC='gcc -O2 -std=gnu17' \
              LD=ld.bfd KERNEL_UNAME=${kernel_uname} \
              modules_install) || \
      (cd /tmp/kmod-build/kernel && \
      make -O V=1 VERBOSE=1 CC='gcc -O2 -std=gnu17' \
              LD=ld.bfd KERNEL_UNAME=${kernel_uname} \
              modules -j$(nproc) && \
      make -O V=1 VERBOSE=1 CC='gcc -O2 -std=gnu17' \
              LD=ld.bfd KERNEL_UNAME=${kernel_uname} \
              modules_install) || exit 1
    fi

    # this break things, remove it
    rm -rf /usr/lib/dracut/modules.d/95nfs
    mkdir -p /usr/lib/dracut/dracut.conf.d
    cat > /usr/lib/dracut/dracut.conf.d/20-bootc-base.conf << 'EOF'
    # We want a generic image; hostonly makes no sense as part of a server side build
    hostonly=no
    add_dracutmodules+=" kernel-modules dracut-systemd systemd-initrd base ostree "
    EOF

